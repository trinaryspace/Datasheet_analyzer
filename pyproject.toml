[project]
name = "datasheet-analyzer"
version = "0.2.0"
description = "Turn big IC datasheets into a token-efficient, citation-verified markdown corpus for AI agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "requests>=2.31",
    # PyMuPDF is AGPL-3.0 / commercial dual-licensed (Artifex). Used here for
    # PDF structure (TOC/pages/hash), not redistribution. Fine for local
    # research tooling; review before shipping as a commercial product.
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # The MCP SDK is optional for *running* the tool and mandatory for
    # *testing* it: the phase-5 gate requires every MCP tool exercised
    # in-process over the SDK's memory transport, so a dev install that
    # skipped those tests would not be running the gate. The SDK-free half of
    # the surface (`mcp_server/responses.py`, the path-safety guard, the
    # install-hint path) is tested in `tests/unit/test_mcp_responses.py`,
    # which needs no extra at all.
    "mcp>=2.0",
    # Optional for *running* the tool, mandatory for *testing* it, for the
    # same reason as `mcp` above: the workbench's endpoints, jobs and streams
    # are covered by the unit suite, so a dev install without them would skip
    # a large part of the gate rather than run it.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
    "httpx>=0.27",
]
# `dsa serve --mcp` only. Kept out of the core dependencies so a plain install
# stays lean: everything except the MCP server works without it, and
# `dsa serve --mcp` without it prints an install hint rather than a traceback.
mcp = [
    "mcp>=2.0",
]
# `dsa serve` (the local workbench) only, and optional for the same reason
# `mcp` is: a plain install stays lean, and `dsa serve` without it prints an
# install hint rather than a traceback. FastAPI serves the API and the built
# frontend; sse-starlette carries job progress and chat tokens, both of which
# are one-way server-to-client and so need no WebSocket.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
]

[project.scripts]
dsa = "datasheet_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: uses the real AFE7950 datasheet + recorded TI fixtures",
    "llm: calls a live LLM API (auto-skipped without ANTHROPIC_API_KEY)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# `Lit_Analyzer/` is a git submodule — a separate project with its own
# `pyproject.toml`, its own `[tool.ruff.lint]` select list and its own history.
# Without this, `ruff check .` from the repo root reports that project's
# findings as if they were this one's, so the repo-wide gate can never be
# green for a reason nobody here can fix. `.scratch/` and `.claude/` are agent
# working state — notes, throwaway probes and git worktrees of other branches —
# not shipped code, and linting another branch's checkout through this one's
# config reports findings that cannot be fixed here either.
# `Reports/` holds the archived plan and report for each phase — a record of
# what was decided and measured, not source. ruff formats Python inside
# Markdown fences, and two of those plans illustrate a model with hand-aligned
# comment columns that carry the explanation; reformatting them would rewrite
# history to satisfy a source-code gate. `docs/` stays in: nothing there is
# affected today, and an ADR's code should read like the code it describes.
extend-exclude = ["Lit_Analyzer", ".scratch", ".claude", "Reports"]
