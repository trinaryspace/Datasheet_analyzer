[project]
name = "datasheet-analyzer"
version = "0.2.0"
description = "Turn big IC datasheets into a token-efficient, citation-verified markdown corpus for AI agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "requests>=2.31",
    # PyMuPDF is AGPL-3.0 / commercial dual-licensed (Artifex). Used here for
    # PDF structure (TOC/pages/hash), not redistribution. Fine for local
    # research tooling; review before shipping as a commercial product.
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
dsa = "datasheet_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasheet_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: uses the real AFE7950 datasheet + recorded TI fixtures",
    "llm: calls a live LLM API (auto-skipped without ANTHROPIC_API_KEY)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
