# Device-table lexicon — the words a pin table and a register summary print.
#
# Data, not code: teaching the abstraction that a vendor writes "Ball No." or
# "Reg Addr" is an edit here, never a Python change (same philosophy as the
# alias lexicon and the vendor brand marks). Nothing in
# `structure/device_tables.py` hard-codes a header string.
#
# Shape, one entry per device-table kind:
#
#   <kind>:
#     key: <field>              # the column that keys the table: unique per
#                               # row, and what a record is cited by
#     identity: <field>         # the column that says "this row is a new
#                               # entry". A row printing none of it is a
#                               # wrapped continuation of the row above (see
#                               # `device_tables.py`); omit to switch that
#                               # reading off for this kind.
#     wrap_keys: true|false     # whether a wrapped continuation line's key
#                               # cell may contribute keys to the entry above
#                               # (a pin *name list* wraps; a bit range never
#                               # does). Default true — the pin reading.
#     columns:                  # the target schema, in *printed* order — the
#       <field>: [header, ...]  # positional fallback maps by this order
#     captions: [phrase, ...]   # title phrases that name this table when its
#                               # headers do not (the headerless route)
#     key_shape: <regex>        # what one key cell looks like, anchored. A
#                               # column of prose is not a key column, and this
#                               # is what says so.
#     key_shape_min: <0..0.6>   # how many of the rows must be key-shaped
#                               # (default 0.6). A kind may only *lower* it,
#                               # and only when it validates its records by
#                               # something stronger (see `bitfield`).
#     expand_key: true|false    # multi-value key cells ("A1, A2", "A1-A4")
#                               # become one record each
#     monotonic_key: true|false # keys must strictly increase down the table
#     key_numeric: hex|dec|""   # how a key reads as a number (order checks)
#
# Header phrases are matched **whole**, after lowercasing, collapsing
# whitespace and dropping footnote markers — never as substrings. "Part
# Number" is not a pin column just because "number" is one, and buying that
# guarantee costs one list entry per real variant.
#
# Caption phrases are matched as whole phrases *inside* the table's caption or
# its section title, because a caption reads "Table 5. Pin Functions".

pin:
  key: pin
  # A pin row is a new pin when it prints a name. ADI's pin tables wrap a long
  # description — and a long *name* list — onto further lines that print no
  # name of their own; those lines belong to the pin above, not to a new one.
  identity: name
  columns:
    pin:
      - pin
      - pins
      - pin no.
      - pin no
      - pin number
      - pin numbers
      - "pin #"
      - "no."
      - "no"
      - number
      - ball
      - ball no.
      - ball no
      - ball number
      - pad
      - pad no.
      - pin/ball
      - ball/pin
      - terminal
      - terminal no.
    name:
      - name
      - names
      - pin name
      - signal
      - signal name
      - mnemonic
      - mnemonics
    type:
      - type
      - pin type
      - i/o
      - io
      - i/o type
      - dir
      - direction
    description:
      - description
      - descriptions
      - function
      - functions
      - pin function
      - pin description
      - signal description
  captions:
    - pin function
    - pin functions
    - pin description
    - pin descriptions
    - pin configuration
    - pin assignment
    - pin assignments
    - pin list
    - terminal function
    - terminal functions
    - signal description
    - signal descriptions
  # "A1", "12", "AB7", "1A" — a designator, not a sentence. Multi-value cells
  # are expanded before this is applied, so each expanded key is checked.
  key_shape: "^[A-Za-z]{0,2}[0-9]{1,4}[A-Za-z]?$"
  expand_key: true
  monotonic_key: false
  key_numeric: ""

register:
  key: address
  # Deliberately **no** `identity:`. The wrapped-row reading absorbs a line
  # that prints no identity into the entry above, *including any key-shaped
  # key in its key cell* — which for a register summary would give a nameless
  # address row the acronym of its neighbour and publish a register the
  # document never named that way. Measured on LMX1204, no row of either
  # printed summary needs the reading at all (a wrapped "Features" cell prints
  # no address either, so it is skipped as unkeyed), so the risk buys nothing.
  # A nameless row therefore stays its own record, graded `low` for having no
  # name — visible rather than silently attached to the register above.
  columns:
    address:
      - address
      - addresses
      - addr
      - addr.
      - address (hex)
      - byte address
      - offset
      - reg
      - reg addr
      - register address
    name:
      - name
      - register
      - register name
      - reg name
      # TI's programmer's guides head this column "Acronym" (`R0`, `R12`) —
      # measured on LMX1204's Table 1-1 / Table 7-1.
      - acronym
      - acronyms
      - mnemonic
    reset:
      - reset
      - reset value
      - default
      - default value
      - por
      - por value
    access:
      - access
      - access type
      - r/w
      - rw
      - type
    # What the register is *for*, in the document's own words. TI prints
    # "Features Requiring This Register"; other vendors print "Description".
    # Verbatim, and the column `dsa regs --q` searches.
    description:
      - description
      - descriptions
      - function
      - functions
      - features requiring this register
  captions:
    - register summary
    - register map
    - register table
    - register list
    - address map
  # "0x1A04", "1A04h", "00" — a hex address as datasheets print them.
  key_shape: "^(0[xX])?[0-9A-Fa-f]{1,8}[hH]?$"
  # An address range ("0x00-0xFF") is a block, not 256 registers with one
  # name; expanding it would fabricate 255 records the document never printed.
  expand_key: false
  monotonic_key: true
  key_numeric: hex

# One register's bit fields, as the per-register field table prints them
# (phase 6, ticket 06). The same structural animal one level down: keyed by a
# bit range, one row per field. `structure/bitfields.py` is its consumer, and
# it is the module that joins a field table to the register it belongs to and
# validates the field set against the register's width — nothing about a bit
# range is judged here.
bitfield:
  key: bit
  # A field row is a new field when it prints a field name. TI's field tables
  # wrap a long description over several printed lines, and ticket 09's rowspan
  # materialization repeats the *bit* cell into them, so a line that prints no
  # name is the description of the field above continuing.
  identity: name
  # ...and, unlike a pin table, a continuation line's key cell may contribute
  # **nothing**: a pin row wraps a comma-separated name list, but a bit range
  # is one token that never wraps, so the only bit a continuation line can
  # carry is the fill the materializer put there — measured on LMX1204, the
  # *next* field's range. Reading it as another key would publish a field with
  # the wrong bits, which is the one failure this ticket exists to avoid.
  wrap_keys: false
  columns:
    bit:
      - bit
      - bits
      - bit no.
      - bit no
      - bit number
      - bit numbers
      - bit range
      - bit position
      - bit positions
      - bit field
      - bit(s)
    name:
      - field
      - fields
      - field name
      - bit name
      - bit field name
    access:
      - type
      - access
      - access type
      - r/w
      - rw
      - mode
    reset:
      - reset
      - reset value
      - default
      - default value
      - por
      - por value
    description:
      - description
      - descriptions
      - function
      - functions
      - comment
      - comments
  captions:
    - register field descriptions
    - field descriptions
    - bit field descriptions
    - bit descriptions
    - bit field definitions
  # "15:3", "7", "0" — a bit range as datasheets print it. Two digits at most:
  # no register in production is 100 bits wide, and a three-digit "cell" is a
  # value that landed in the bit column.
  key_shape: "^[0-9]{1,2}(:[0-9]{1,2})?$"
  # Lowered, and this is the one place in the lexicon that lowers anything.
  # A field table's region routinely sweeps up the navigation line printed
  # under it ("R12 is shown in Table 1-13. Return to the Summary Table."), and
  # on a register with two printed fields those two lines are half the rows —
  # at the default bar every field of a small register is thrown away. It is
  # safe *here* because a bit-field set has a stronger validation than any
  # ratio: it must tile the register's width with no overlap and no overflow
  # (`structure/bitfields.py`), which no prose row can do, and the bits it does
  # not cover are published as `unaccounted_bits` rather than assumed.
  key_shape_min: 0.25
  # "15:3" is one field, not thirteen: the range *is* the key, and expanding it
  # would publish thirteen fields the document never named.
  expand_key: false
  # Field tables count **down** (15:8, 7, 6:0), so the ascending check does not
  # apply. Ordering is not what makes a field set sound — tiling the register's
  # width with no overlap is, and `structure/bitfields.py` is where that is
  # judged, because only there is the register's width known.
  monotonic_key: false
  key_numeric: ""
