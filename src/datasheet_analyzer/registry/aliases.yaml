# Alias lexicon — designers' words -> datasheets' symbols.
#
# Data, not code: adding a synonym is an edit here, never a Python change
# (same philosophy as the vendor brand lexicon in vendor.py).
#
# Shape, one entry per canonical symbol family:
#
#   SYMBOL:
#     names: [phrase, phrase, ...]   # what a designer types; matched as whole
#                                    # phrases inside the query, and against a
#                                    # record's own symbol/name text
#     expect_unit: "<canonical>"     # RANKS tie-ing candidates; never filters,
#                                    # never hides a record with no unit
#     kind: <free text>              # rough quantity class, for readers
#     prefix_match: true             # this entry is a family...
#     prefixes: [IDD, IVDD]          # ...covering these symbol prefixes
#                                    # (defaults to the canonical symbol)
#
# Keep `names` phrases at two characters or more and specific enough to be
# unambiguous on their own: a bare "gain" or "supply" would hijack half the
# corpus. The resolution ladder tries exact symbols first, so short symbols
# (TJ, TA, IDD) need no alias of their own.
#
# Seeded from the symbols present across the six built corpora (AFE7950,
# AFE7953, AD9081, LM741, QPA1003P, HMC520A); regenerate the coverage
# measurement with `scripts/seed_aliases.py`.

# --- thermal -----------------------------------------------------------------
TJ:
  names:
    - junction temperature
    - operating junction temperature
    - maximum junction temperature
    - max junction temperature
    - channel temperature
  expect_unit: "°C"
  kind: temperature

TA:
  names:
    - ambient temperature
    - operating ambient temperature
    - operating temperature
    - operating temperature range
  expect_unit: "°C"
  kind: temperature

Tstg:
  names:
    - storage temperature
    - storage temperature range
  expect_unit: "°C"
  kind: temperature

RthJA:
  names:
    - junction to ambient thermal resistance
    - thermal resistance
    - theta ja
  expect_unit: "°C/W"
  kind: thermal resistance

RthJC:
  names:
    - junction to case thermal resistance
    - junction to case top thermal resistance
    - theta jc
  expect_unit: "°C/W"
  kind: thermal resistance

# --- supplies ----------------------------------------------------------------
VDD:
  names:
    - supply voltage
    - supply voltage range
    - operating supply voltage
    - analog supply voltage
    - digital supply voltage
    - rail voltage
  expect_unit: V
  kind: voltage
  prefix_match: true
  prefixes: [VDD, AVDD, DVDD, VCC, VDDA]

IDD:
  names:
    - supply current
    - quiescent current
    - operating current
    - total supply current
    - current consumption
  expect_unit: mA
  kind: current
  prefix_match: true
  prefixes: [IDD, IVDD, ICC, IQ]

Pdiss:
  names:
    - power dissipation
    - total power dissipation
    - power consumption
    - dissipated power
  expect_unit: mW
  kind: power

