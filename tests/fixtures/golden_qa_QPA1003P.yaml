# Golden Q&A set for the QPA1003P datasheet (Rev. I, phase-4 gate PDF,
# pdf_layout path). Qorvo part with no PDF outline (per-page sections) and
# no "Table N." / "Figure N." captions at all. Since ticket 09 the
# heading-anchored pass lands its real tables (abs-max + recommended
# operating conditions pair split at the mirrored header, electrical
# specifications, thermal table, handling precautions — 5 tables, 41 spec
# records) and the title-anchored pass lands 4 figures (block diagram +
# the layout/plot headings), so this golden now mixes text, spec_query and
# plot_query questions (the ticket-07 text-only boundary is superseded;
# recorded in KNOWN_SHORTCOMINGS.md + issue 09). Every expected_substring
# was verified against the printed PDF page text (page_texts) AND the
# built corpus section covering that page.
questions:
  - id: q01-band-and-output-power
    question: What frequency range does the QPA1003P cover and what saturated output power does it provide?
    expected_substrings: ["1 – 8 GHz", "10 W", "saturated output power"]
    pages: [1]
    kind: direct

  - id: q02-process
    question: Which process is the QPA1003P fabricated on?
    expected_substrings: ["0.15um", "GaN on SiC", "QGaN15"]
    pages: [1]
    kind: direct

  - id: q03-efficiency-and-gain
    question: What power-added efficiency and large-signal gain are typical?
    expected_substrings: ["30%", "25 dB"]
    pages: [1]
    kind: direct

  - id: q04-test-conditions
    question: Under what conditions are the electrical specifications measured?
    expected_substrings: ["+28 V", "650 mA", "CW"]
    pages: [2]
    kind: direct

  - id: q05-output-power-at-1ghz
    question: What is the output power at PIN = 15 dBm and 1 GHz?
    expected_substrings: ["39.7", "dBm"]
    pages: [2]
    kind: direct

  - id: q06-pae-at-4ghz
    question: What power-added efficiency is typical at 4 GHz with PIN = 15 dBm?
    expected_substrings: ["35", "%"]
    pages: [2]
    kind: direct

  - id: q07-thermal-resistance
    question: What is the junction-to-case thermal resistance at TBASE = 85°C and PDISS = 18.2 W?
    expected_substrings: ["Thermal Resistance", "3.62", "°C/W"]
    pages: [15]
    kind: direct

  - id: q08-channel-temperature
    question: What is the quiescent channel temperature?
    expected_substrings: ["Channel Temperature", "151", "°C"]
    pages: [15]
    kind: direct

  - id: q09-rf-input-impedance
    question: What impedance is the RF input matched to?
    expected_substrings: ["matched to 50", "Ω"]
    pages: [16]
    kind: direct

  - id: q10-esd-and-msl
    question: What are the ESD human body model rating and moisture sensitivity level?
    expected_substrings: ["Human Body Model", "0B", "MSL3"]
    pages: [20]
    kind: direct

  - id: q11-reflow-temperature
    question: Is the package compatible with lead-free soldering and what is the peak reflow temperature?
    expected_substrings: ["lead-free", "260°C"]
    pages: [19]
    kind: direct

  - id: s1-spec-output-power
    question: What output power does the QPA1003P deliver at the different frequencies?
    expected_substrings: ["39.7", "40.7", "39.9", "dBm"]
    pages: [2]
    kind: direct
    spec_query: {symbol: "Output Power @ P"}
    notes: ticket-09 materialized children of the electrical table; the
      "IN = 15 dBm" superscript prints as its own cell fragment and lives
      in the records' name fields, the frequency fragments in the name
      fields of the parent-merged rows (values 39.7/40.7/39.9 dBm printed
      on page 2)

  - id: s2-spec-frequency-range
    question: What frequency range does the QPA1003P cover?
    expected_substrings: ["1", "8", "GHz"]
    pages: [2]
    kind: direct
    spec_query: {symbol: "Operational Frequency Range"}

  - id: p1-functional-block-diagram
    question: Where is the functional block diagram of the QPA1003P?
    expected_substrings: ["Functional Block Diagram"]
    pages: [1]
    kind: plot
    plot_query: {caption_contains: "Functional Block Diagram"}
    notes: title-anchored figure (no "Figure N." caption exists; the title
      band prints at 14 pt inside a drawn emphasis band)
