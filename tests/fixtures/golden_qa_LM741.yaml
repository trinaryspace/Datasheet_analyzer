# Golden Q&A set for the LM741 datasheet (SNOSC25D, phase-4 gate PDF,
# pdf_layout path). Old-TI captionless-era part: heading-anchored tables
# since ticket 09 (6 tables: abs-max + ESD + recommended operating
# conditions on p4, electrical characteristics on p5/p6, orderable part
# numbers on p13) -> 71 spec records; 3 figure captions (2 covered by
# plot questions). The ticket-07
# "text + plot only" boundary is superseded — the abstract spec questions
# below resolve real records (author-probed: values + pages measured from
# the built corpus). Every expected_substring was verified against the
# printed PDF page text (page_texts) AND the built corpus section covering
# that page.
questions:
  - id: q01-features-protection
    question: What protection and latch-up behavior does the LM741 feature?
    expected_substrings: ["Overload Protection on the Input and Output", "No Latch-Up"]
    pages: [1]
    kind: direct

  - id: q02-general-purpose-description
    question: What is the LM741 and which industry standard does it improve on?
    expected_substrings: ["general-purpose operational", "LM709"]
    pages: [1]
    kind: direct

  - id: q03-supply-voltage
    question: What are the absolute maximum supply voltages for the LM741 and LM741C?
    expected_substrings: ["±22", "±18"]
    pages: [4]
    kind: direct

  - id: q04-power-dissipation
    question: What is the absolute maximum power dissipation?
    expected_substrings: ["500", "mW"]
    pages: [4]
    kind: direct

  - id: q05-differential-input-voltage
    question: What is the absolute maximum differential input voltage?
    expected_substrings: ["±30", "V"]
    pages: [4]
    kind: direct

  - id: q06-input-voltage-range
    question: What is the absolute maximum input voltage?
    expected_substrings: ["±15", "V"]
    pages: [4]
    kind: direct

  - id: q07-input-offset-voltage
    question: What is the input offset voltage of the LM741 at TA = 25°C?
    expected_substrings: ["Input offset voltage", "5", "mV"]
    pages: [5]
    kind: direct

  - id: q08-input-resistance
    question: What is the typical input resistance of the LM741?
    expected_substrings: ["Input resistance", "2", "MΩ"]
    pages: [5]
    kind: direct

  - id: q09-common-mode-rejection
    question: What is the common-mode rejection ratio of the LM741A?
    expected_substrings: ["Common-mode rejection ratio", "80", "95", "dB"]
    pages: [6]
    kind: direct

  - id: q10-single-or-dual-supply
    question: Can the LM741 operate from a single power supply?
    expected_substrings: ["single or dual power supply"]
    pages: [7]
    kind: direct

  - id: s1-spec-supply-absmax
    question: What are the absolute maximum supply voltages of the LM741 variants?
    expected_substrings: ["±22", "±18"]
    pages: [4]
    kind: direct
    spec_query: {symbol: "Supply"}
    notes: heading-anchored abs-max records; the device-variant sub-rows
      carry the fused per-variant maxima ("±22 ±18" shape on the printed
      page)

  - id: s2-spec-common-mode-rejection
    question: What common-mode rejection ratio does the LM741 achieve?
    expected_substrings: ["80", "95", "dB"]
    pages: [5]
    kind: direct
    spec_query: {symbol: "Common-mode"}
    notes: 6.5-electrical record (min 80 / typ 95 dB); the LM741A table on
      p6 prints the same values

  - id: s3-spec-power-dissipation
    question: What is the absolute maximum power dissipation of the LM741?
    expected_substrings: ["500", "mW"]
    pages: [4]
    kind: direct
    spec_query: {symbol: "Power dissipation"}

  - id: p1-noninverting-amplifier-circuit
    question: Which figure shows the LM741 noninverting amplifier circuit?
    expected_substrings: ["LM741 Noninverting Amplifier Circuit"]
    pages: [9]
    kind: plot
    plot_query: {caption_contains: "LM741 Noninverting Amplifier Circuit"}

  - id: p2-application-waveforms
    question: Which figure shows the waveforms of the LM741 noninverting amplifier circuit?
    expected_substrings: ["Waveforms for LM741 Noninverting Amplifier Circuit"]
    pages: [10]
    kind: plot
    plot_query: {caption_contains: "Waveforms for LM741 Noninverting Amplifier Circuit"}
