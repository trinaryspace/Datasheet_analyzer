# Golden Q&A set for the AD9081 datasheet (phase-4 gate PDF, pdf_layout
# path). Set shipped by ticket 05 (footnote-citation + figure-render
# answer paths) and extended by ticket 07 with a provably-complete spec
# query + hard-fail wiring; every expected_substring was verified against
# the printed PDF page text.
#
# q1 cites text that exists in the corpus ONLY because ticket 05 attaches
# footnote bodies to their table (footnote 1 of "Table 3. DAC DC
# Specifications", page 5).
#
# q2's original spec_query was removed at ticket 07: it had never been
# executed by any test, and the CLI's `--specs` check proved it cannot
# pass — the row's value cells live on child rows (the parent record
# honestly keeps empty min/typ/max, per the "values on child rows" rule),
# so no record for that symbol carries "3.3"/"dBm". The footnote answer
# path it guards stays text-verified here; q3-spec carries a spec_query
# whose records resolve complete values.
questions:
  - id: q1-dc-coupled-fullscale-limit
    question: Why is the full-scale output current limited for dc-coupled applications?
    expected_substrings: ["dc-coupled applications", "maximum VCMOUT specification"]
    pages: [5]
    kind: direct
    notes: answer is footnote 1 text of Table 3, attached with the table

  - id: q2-fullscale-sine-power
    question: What is the full-scale sine wave output power with AC coupling?
    expected_substrings: ["Full-Scale Sine Wave Output Power", "AC coupling",
                          "2:1 balun", "3.3", "dBm"]
    pages: [5]
    kind: direct
    notes: the symbol cell carries the glued superscript citation "AC Coupling2";
      values live on child rows, so no spec_query here (see header note)

  - id: q3-spec-gain-matching
    question: What is the gain matching of the DAC channels with AC coupling?
    expected_substrings: ["Gain Matching", "0.7", "% FSR"]
    pages: [5]
    kind: direct
    spec_query: {symbol: "Gain Matching"}
    notes: Table 3 row with complete min/typ/max on the parent record

  - id: p1-hd2-6gsps
    question: Which figure shows HD2 vs fOUT over digital scale at a 6 GSPS DAC sample rate?
    expected_substrings: ["HD2 vs. fOUT over Digital Scale, 6 GSPS"]
    pages: [27]
    kind: plot
    plot_query: {caption_contains: "HD2 vs. fOUT over Digital Scale, 6 GSPS"}
    notes: vector plot clip-rendered from the region above its caption
