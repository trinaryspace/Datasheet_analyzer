# Golden Q&A set for the AD9081 datasheet (phase-4 gate PDF, pdf_layout
# path). Set shipped by ticket 05 (footnote-citation + figure-render
# answer paths) and extended by ticket 07 with a provably-complete spec
# query + hard-fail wiring; every expected_substring was verified against
# the printed PDF page text.
#
# q1 cites text that exists in the corpus ONLY because ticket 05 attaches
# footnote bodies to their table (footnote 1 of "Table 3. DAC DC
# Specifications", page 5).
#
# q2's original spec_query was removed at ticket 07: it had never been
# executed by any test, and the CLI's `--specs` check proved it cannot
# pass — the row's value cells live on child rows (the parent record
# honestly keeps empty min/typ/max, per the "values on child rows" rule),
# so no record for that symbol carries "3.3"/"dBm". The footnote answer
# path it guards stays text-verified here; q3-spec carries a spec_query
# whose records resolve complete values.
questions:
  - id: q1-dc-coupled-fullscale-limit
    question: Why is the full-scale output current limited for dc-coupled applications?
    expected_substrings: ["dc-coupled applications", "maximum VCMOUT specification"]
    pages: [5]
    kind: direct
    notes: answer is footnote 1 text of Table 3, attached with the table

  - id: q2-fullscale-sine-power
    question: What is the full-scale sine wave output power with AC coupling?
    expected_substrings: ["Full-Scale Sine Wave Output Power", "AC coupling",
                          "2:1 balun", "3.3", "dBm"]
    pages: [5]
    kind: direct
    notes: the symbol cell carries the glued superscript citation "AC Coupling2";
      values live on child rows, so no spec_query here (see header note)

  - id: q3-spec-gain-matching
    question: What is the gain matching of the DAC channels with AC coupling?
    expected_substrings: ["Gain Matching", "0.7", "% FSR"]
    pages: [5]
    kind: direct
    spec_query: {symbol: "Gain Matching"}
    notes: Table 3 row with complete min/typ/max on the parent record

  - id: a1-ask-gain-matching
    question: What gain matching do the DAC channels achieve?
    expected_substrings: ["Gain Matching", "0.7", "% FSR"]
    pages: [5]
    kind: ask
    ask_query: {route: spec}
    notes: ticket-09 ask path — the twin of q3-spec. One `dsa ask` call must
      land the same Table 3 row on the same printed page, inside its budget.

  - id: k1-search-dac-dc-specifications
    question: Where is the full-scale output current of the DACs specified?
    expected_substrings: ["dc-coupled applications", "maximum VCMOUT specification"]
    pages: [5]
    kind: search
    search_query: {query: "full-scale output current dc-coupled applications"}
    notes: ticket-09 search path — the twin of q1. Top-1 must be the
      unnumbered "DAC DC Specifications" section, whose text holds the
      answer only because ticket 05 attaches footnote bodies to their table.

  - id: p1-hd2-6gsps
    question: Which figure shows HD2 vs fOUT over digital scale at a 6 GSPS DAC sample rate?
    expected_substrings: ["HD2 vs. fOUT over Digital Scale, 6 GSPS"]
    pages: [27]
    kind: plot
    plot_query: {caption_contains: "HD2 vs. fOUT over Digital Scale, 6 GSPS"}
    notes: vector plot clip-rendered from the region above its caption

  # --- phase 6: the derived device tables -------------------------------
  #
  # Both go through `dsa ask` and both name the route the pack must take, so
  # a pin question answered from a paragraph is a failure even when the words
  # happen to match. Ground truth is unchanged: the page the question cites
  # and the strings printed on it.

  - id: p1-pins-ground
    question: Which pins are ground?
    expected_substrings: ["GND", "Ground References"]
    pages: [23]
    kind: ask
    ask_query: {route: pin}
    notes: phase-6 pin path. 15 pins carry the lexicon label `ground`; the
      pack must answer from `pins.json`, cited to the page that prints them.

  - id: p2-pin-a1
    question: What is pin A1 on this device?
    expected_substrings: ["A1", "GND"]
    pages: [23]
    kind: ask
    ask_query: {route: pin}
    notes: phase-6 pin path, the designator direction — a printed ball
      number resolves to its signal name and its printed description.

# Design-card goldens (phase 6, ticket 10). A card question is verified by
# `evalh.citations.verify_card_queries`, not by `dsa verify`: `GoldenQuestion`
# carries no `card_query` marker and `cli.py` is frozen, so these live in
# their own block, which `load_golden_yaml` ignores. Every expected substring
# is a value the datasheet *printed* — never a computed margin, which the
# page-truth check would rightly fail.
cards:
  - id: c1-power-rails
    question: What supply rails does the AD9081 need and at what voltages?
    card: power
    row: AVDD2
    expected_substrings: ["1.9", "2.0", "2.1"]
    pages: [4]
    notes: Table 1 (Absolute Maximum / recommended supplies), 2.0 V rail
      family — the card composes it from records already published.

  - id: c2-interface-jesd
    question: Which JESD204 standards does this converter support?
    card: interface
    expected_substrings: ["JESD204B", "JESD204C"]
    pages: [11]
    notes: the one interface row this part's records can address (see
      KNOWN_SHORTCOMINGS.md - spec ids are not unique in this document).
